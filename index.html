<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="description" content="GPverse StagePlanner: carica il copione, scegli il tuo ruolo e impara la parte ascoltando; prove con partner vocale; palco e scenografia vista dall'alto e dal pubblico.">
<title>GPverse StagePlanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060b; --panel:#080d17; --panel2:#0c1322; --line:#15233a; --line2:#1f3352;
  --cyan:#3ae8ff; --cyan-d:#1597b0; --violet:#8d7bff; --violet-d:#5a4bd1;
  --text:#d5f4ff; --dim:#6f87a6; --faint:#3a4c66;
  --rec:#ff3d6e; --warn:#ffc04a; --ok:#3affb0; --mag:#ff2bd6;
  --f-display:'Orbitron','Exo 2',system-ui,sans-serif;
  --f-body:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;
  --glow:0 0 12px rgba(58,232,255,.35);
  --navh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body);
  background-image:radial-gradient(1200px 500px at 50% -200px,rgba(141,123,255,.10),transparent 70%),radial-gradient(900px 400px at 100% 100%,rgba(58,232,255,.06),transparent 70%);
  background-attachment:fixed}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;transition:border-color .15s,box-shadow .15s,background .15s}
button:hover{border-color:var(--cyan-d);box-shadow:var(--glow)}
button:disabled{opacity:.4;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{background:#02040a;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=color]{padding:2px;height:38px;width:52px}
input[type=range]{accent-color:var(--cyan);padding:0;border:0;background:none}
input[type=checkbox]{width:auto;accent-color:var(--cyan)}
label.f{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;letter-spacing:.04em}
.wrap{max-width:1180px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(var(--navh) + 24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .logo{width:40px;height:40px;border-radius:10px;object-fit:cover;box-shadow:var(--glow)}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand small{font:700 10px var(--f-display);letter-spacing:.32em;color:var(--violet)}
.brand b{font:900 21px var(--f-display);letter-spacing:.05em;color:var(--cyan);text-shadow:0 0 14px rgba(58,232,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font:700 12px var(--f-mono);padding:4px 9px;border-radius:999px;color:var(--violet);border-color:var(--violet-d)}
.sp{flex:1}
.iconbtn{padding:8px 11px;font-size:16px;line-height:1}

h2.sec{margin:18px 0 10px;font:700 12px var(--f-display);letter-spacing:.22em;color:var(--violet);display:flex;align-items:center;gap:8px}
h3{margin:0 0 6px;font:700 15px var(--f-display);letter-spacing:.08em;color:var(--cyan)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--dim)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.go{background:linear-gradient(180deg,rgba(58,232,255,.22),rgba(58,232,255,.06));border-color:var(--cyan);font-weight:600}
.danger{border-color:#5a2236;color:#ffb3c6}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow);background:rgba(58,232,255,.08)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;font-size:13px;background:transparent}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:rgba(58,232,255,.14);color:var(--cyan)}
.badge{display:inline-block;font:700 10px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.bar{height:6px;border-radius:9px;background:#0a1220;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}

/* home */
.hero{display:flex;gap:16px;align-items:center;margin:6px 0 18px}
.hero img{width:74px;height:74px;border-radius:16px;box-shadow:var(--glow)}
.hero p{margin:4px 0 0;color:var(--dim)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.pcard:hover{border-color:var(--cyan-d)}
.pcard .t{font:700 16px var(--f-display);letter-spacing:.04em;color:var(--text)}
.pcard svg{width:100%;height:110px;background:#02040a;border-radius:10px}
.empty{text-align:center;padding:30px 14px;color:var(--dim)}

/* wizard */
.steps{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.steps span{font:700 11px var(--f-display);letter-spacing:.12em;padding:6px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--faint)}
.steps span.on{color:var(--cyan);border-color:var(--cyan-d);box-shadow:var(--glow)}
.steps span.done{color:var(--violet);border-color:var(--violet-d)}
.wz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
@media (max-width:860px){.wz{grid-template-columns:1fr}}
.preview svg{width:100%;height:auto;max-height:52vh;background:#02040a;border-radius:12px;border:1px solid var(--line)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;color:var(--dim)}
.drop.over{border-color:var(--cyan);color:var(--cyan)}
.navbtns{display:flex;gap:10px;justify-content:space-between;margin-top:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(4,6,11,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:150px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font:600 11px var(--f-body);color:var(--dim);border-radius:10px}
.nav button span{font-size:20px;line-height:1}
.nav button[aria-current=true]{color:var(--cyan);background:rgba(58,232,255,.08);box-shadow:none}

/* copione */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto;min-width:0;flex:1 1 150px}
.script{display:flex;flex-direction:column;gap:2px}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.ln:hover{background:rgba(58,232,255,.04)}
.ln .who{font:700 11px var(--f-display);letter-spacing:.08em;padding:3px 8px;border-radius:7px;white-space:nowrap;margin-top:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ln .tx{white-space:pre-wrap;word-break:break-word}
.ln .tx i{color:var(--dim)}
.ln.mine{background:rgba(58,232,255,.07);border-color:rgba(58,232,255,.25)}
.ln.t-act .tx,.ln.t-desc .tx{color:#9fb3cc;font-style:italic}
.ln.t-act .tx{font-weight:600;font-style:normal}
.ln.t-cue .tx{color:var(--warn);font-family:var(--f-mono);font-size:13px}
.ln.t-head{margin-top:14px;cursor:pointer;grid-template-columns:1fr auto}
.ln.t-head .tx{font:700 14px var(--f-display);letter-spacing:.14em;color:var(--violet);text-transform:uppercase}
.ln .side{display:flex;gap:4px;align-items:center}
.lv{width:10px;height:10px;border-radius:50%;border:1px solid var(--line2)}
.pin{font-size:13px}
.ln.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{background:rgba(141,123,255,.3)}100%{background:transparent}}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.sheet-bg{align-items:center}}
.sheet{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
@media (min-width:760px){.sheet{border-radius:18px}}
.sheet h3{display:flex;align-items:center;gap:10px}
.sheet .x{margin-left:auto;padding:4px 10px}
.sheet .fld{margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--panel2);border:1px solid var(--cyan-d);box-shadow:var(--glow);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(560px,calc(100% - 32px));text-align:center}
.cl article{border-left:2px solid var(--violet-d);padding-left:12px;margin-bottom:14px}
.cl h4{margin:0 0 4px;font:700 13px var(--f-display);letter-spacing:.1em;color:var(--cyan)}
.cl ul{margin:6px 0 0;padding-left:18px}

/* palco */
.stagebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.views{display:grid;gap:10px;grid-template-columns:1fr}
.views.both{grid-template-columns:1fr 1fr}
@media (max-width:860px){.views.both{grid-template-columns:1fr}}
.vbox{position:relative;background:#02040a;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vbox .lbl{position:absolute;left:10px;top:8px;font:700 10px var(--f-display);letter-spacing:.2em;color:var(--violet);pointer-events:none;z-index:2}
.vbox .tools{position:absolute;right:8px;top:6px;display:flex;gap:6px;z-index:2}
.vbox .tools button{padding:4px 8px;font-size:12px;background:rgba(8,13,23,.85)}
#topWrap{touch-action:none;height:420px;cursor:default}
#topWrap svg,#frontWrap svg{width:100%;height:100%;display:block}
#frontWrap{height:420px}
.timeline{margin-top:10px}
.timeline .cur{font-size:14px;margin-top:6px;min-height:42px}
.timeline .cur b{font-family:var(--f-display);font-size:11px;letter-spacing:.1em}
.timeline input[type=range]{width:100%}
.props{margin-top:10px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.lib button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:12px}
.lib button span{font-size:22px}

/* prove */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:14px}
.mode .ic{font-size:26px}
.mode b{display:block;font:700 13px var(--f-display);letter-spacing:.08em;color:var(--cyan);margin-bottom:3px}
.mode small{color:var(--dim);font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 22px var(--f-mono);color:var(--cyan)}
.stat span{font-size:12px;color:var(--dim)}

.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.player .ph{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.player .ph .t{font:700 13px var(--f-display);letter-spacing:.1em;color:var(--violet);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pb{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.player .pf{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--panel)}
.player .pf button{min-width:64px;font-size:15px}
.player .big{font-size:calc(19px * var(--fs,1));line-height:1.5}
.ctx{opacity:.6;margin-bottom:10px}
.ctx .who{font:700 11px var(--f-display);letter-spacing:.08em}
.focus{border:1px solid var(--cyan-d);border-radius:14px;padding:16px;background:rgba(58,232,255,.05);box-shadow:var(--glow)}
.focus .who{font:700 12px var(--f-display);letter-spacing:.12em;margin-bottom:6px}
.mask{color:var(--faint);letter-spacing:.06em}
.diff .ok{color:var(--ok)}
.diff .ko{color:var(--rec);text-decoration:underline wavy}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{padding:14px 6px;font-weight:700}
.r0{border-color:#5a2236!important;color:#ff9db5}
.r1{border-color:#5a4a22!important;color:var(--warn)}
.r2{border-color:#1e5a44!important;color:var(--ok)}
.live{margin-top:10px;color:var(--warn);font-style:italic;min-height:1.4em}
.mic{display:inline-flex;align-items:center;gap:8px;color:var(--rec);font:700 12px var(--f-display);letter-spacing:.14em}
.mic i{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.mini{margin-top:14px}
.mini svg{width:100%;max-height:30vh;background:#02040a;border-radius:10px;border:1px solid var(--line)}
.tele{font-size:calc(30px * var(--fs,1));line-height:1.55;padding-bottom:70vh}
.tele p{margin:0 0 .7em}
.rec-list .ln{cursor:default}
.recbtn.on{background:var(--rec);color:#fff;border-color:var(--rec)}
.foot{margin-top:24px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* attore: avvio rapido, ruolo, ascolto */
.starts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.starts{grid-template-columns:1fr}}
.start{text-align:left;display:flex;gap:14px;align-items:flex-start;padding:18px}
.start .ic{font-size:34px;line-height:1}
.start b{display:block;font:700 16px var(--f-display);letter-spacing:.06em;color:var(--cyan);margin-bottom:4px}
.start small{color:var(--dim);font-size:13.5px}
.rolebar{width:100%;display:flex;align-items:center;gap:8px;margin:-4px 0 14px;padding:10px 14px;text-align:left;border-radius:12px;background:linear-gradient(90deg,rgba(58,232,255,.08),rgba(141,123,255,.06));border-color:var(--line2)}
.lmodes{display:grid;gap:10px}
.lmode{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.lmode.on{border-color:var(--cyan-d);box-shadow:var(--glow)}
.lhead{display:flex;gap:12px;align-items:flex-start}
.lhead .ic{font-size:26px;line-height:1}
.lhead b{display:block;font:700 13px var(--f-display);letter-spacing:.07em;color:var(--cyan);margin-bottom:3px}
.lmode .radio{font-size:18px;color:var(--cyan)}
.lx{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);cursor:default}
.bigplay{display:block;width:100%;max-width:520px;margin:18px auto 0;padding:18px;font:900 18px var(--f-display);letter-spacing:.2em}
.busy{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px}
.busy .card{display:flex;gap:14px;align-items:center;max-width:420px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--cyan);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
details summary{cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<div id="player" class="player" hidden></div>

<script src="js/core.js"></script>
<script src="js/stage.js"></script>
<script src="js/prove.js"></script>
<script>App.start();</script>
</body>
</html>
